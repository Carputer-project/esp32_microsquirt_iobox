; ESP32 MicroSquirt I/O box
; Reads MS2/Extra MicroSquirt outpc realtime CAN broadcast (base ID 0x5F0, 500kbps)
; and drives fan / IAC PWM / generic outputs with an IO-box style fail-safe.
;
; Board: ESP32 DevKit (WROOM-32, 30-pin) + SN65HVD230 CAN transceiver
;
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit GC9A01A@^1.1.0
