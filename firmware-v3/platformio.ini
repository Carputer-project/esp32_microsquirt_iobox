; ESP32 MicroSquirt I/O box v3 (iobox3)
; 3x3 WROOM-32 module board. Reads MS2/Extra MicroSquirt outpc realtime CAN
; broadcast (base ID 0x5F0, 500kbps) and drives fan / IAC PWM (GPIO19 MOSFET) /
; 7 ULN2003A outputs (O1-O7 = 13,12,14,27,26,25,33) with an IO-box style fail-safe.
; Round display + D1-D3 switches OPT-IN via 'P TFT 1' (offs by default so they
; can't clash with the iobox3 pin map, e.g. GPIO19 = TFT DC vs IAC).
;
; Pin map (LOCKED 2026-08-09):
;   IAC/MOSFET gate = 19   CAN TX=5 RX=4   A1-A4 = 36,39,34,35   LED=2
;   D1-D3 = 16,17,18 (switches, active-low)   TFT SCLK=15 MOSI=21 CS=22 DC=19
;
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit GC9A01A@^1.1.0
